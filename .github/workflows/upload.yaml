name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - run: corepack enable && corepack prepare yarn@4.12.0 --activate

    - uses: calcit-lang/setup-calcit@v1

    # Migration note: `caps --strict` is blocked by published provider
    # conflicts (respo-ui 0.7.19 pins respo 0.16.95 / js-ffi 0.1.12 while this
    # project uses respo 0.16.100 / js-ffi 0.1.16). Tighten once respo-ui
    # publishes matching ranges.
    - name: "load deps"
      run: caps --ci && yarn install --immutable

    - name: Validate Calcit snapshot and types
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json

    - name: "compiles to js"
      run: >
        calcit calcit.cirru js
        && yarn vite build --base=./

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
